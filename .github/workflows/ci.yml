name: CI

# ---------------------------------------------------------------------------
# Triggers
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    # Note: which branch/ref this run builds from is already chosen via the
    # "Use workflow from" branch selector when triggering manually (or via
    # `gh workflow run --ref <branch>` / the API `ref` field) — that's native
    # GitHub Actions behavior for workflow_dispatch, so no extra "branch"
    # input is needed here.
    inputs:
      image_tag:
        description: "Custom Docker image tag (e.g. nightly, test-feature)"
        required: false
        default: "nightly"
        type: string
      push_to_ghcr:
        description: "Push the built image to GHCR (ghcr.io)?"
        required: false
        default: true
        type: boolean

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Supply-chain hardening (see CLAUDE.md, "CI/CD & Sécurité"):
#
# 1) Deny every permission by default at the workflow level, then grant back
#    only what each job actually needs via its own `permissions:` block
#    below — GITHUB_TOKEN never carries more access than a job declares.
# 2) Every `uses:` below is pinned to a full commit SHA, never a floating
#    tag (`@v4`) or branch — a compromised or re-pointed tag on any of these
#    actions cannot silently pull in different code. The `# vX.Y.Z` comment
#    after each pin is for human readability only; the SHA is what actually
#    gets checked out. See CLAUDE.md for the rule on adding new actions.
# ---------------------------------------------------------------------------
permissions: read-all

env:
  REGISTRY: ghcr.io
  GO_VERSION_FILE: go.mod
  # Go-ecosystem security tools, installed with `go install` at an exact
  # pinned version (never `@latest`) — this is the same anti-supply-chain-
  # poisoning principle as the SHA-pinned actions below, applied to the two
  # tools here that are Go modules rather than GitHub Actions.
  GOVULNCHECK_VERSION: v1.7.0
  GOSEC_VERSION: v2.29.0
  GOLANGCI_LINT_VERSION: v2.14.0
  GITLEAKS_VERSION: v8.28.0

jobs:
  # -------------------------------------------------------------------------
  # 1) Lint & quality
  # -------------------------------------------------------------------------
  lint:
    name: Lint & quality (gofmt, vet, go mod verify, golangci-lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Read the version straight from go.mod so this workflow can never
          # drift from the pinned Go version documented in CLAUDE.md.
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: gofmt (fail on unformatted files)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod verify
        # Confirms every module in the local module cache matches the
        # checksums recorded in go.sum, so a tampered or corrupted dependency
        # can never silently compile into the binary.
        run: go mod verify

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  # -------------------------------------------------------------------------
  # 2) Unit tests
  # -------------------------------------------------------------------------
  test:
    name: Unit tests (race + cover)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: go test -race -cover
        # CGO_ENABLED=1 here is required by the race detector itself (it
        # links a small C runtime) and is scoped to this one test step only
        # — it has no bearing on the shipped binary, which is still always
        # built with CGO_ENABLED=0 in the Dockerfile (see CLAUDE.md, "Go
        # version pinning is intentional and fragile" — modernc.org/sqlite
        # is pure Go either way). ubuntu-latest ships gcc, so this needs no
        # extra setup.
        env:
          CGO_ENABLED: "1"
        run: go test -v -race -cover ./...

  # -------------------------------------------------------------------------
  # 3) Security scans: native Go vuln scan, Go SAST, dependency CVEs
  # -------------------------------------------------------------------------
  security-scan:
    name: Security scan (govulncheck, gosec, Trivy deps, gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload SARIF to the Security tab
      actions: read # required by upload-sarif to read this workflow run (private repos)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks below scans the full commit history, not just the tree
          # at HEAD — that needs every commit, not the default shallow
          # (fetch-depth: 1) clone every other job in this workflow uses.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: "govulncheck (known-vulnerability scan: stdlib + dependencies)"
        # Native to the Go ecosystem (golang.org/x/vuln, maintained by the Go
        # team) rather than a third-party scanner — flags only vulnerabilities
        # your code actually reaches, not every CVE in a transitive dependency.
        run: govulncheck ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}

      - name: Run gosec (Go source SAST)
        run: gosec -fmt=sarif -out=gosec-results.sarif ./...

      - name: Upload gosec SARIF to GitHub Security tab
        # hashFiles() guards against gosec crashing before writing a report
        # at all (as opposed to running cleanly and just finding issues,
        # which is the normal case this step needs to run for) — without it,
        # `if: always()` alone still runs this step, which then fails on a
        # missing file and cascades into a second, unrelated-looking error.
        # continue-on-error is a second line of defense so a transient
        # upload failure (e.g. a GitHub API hiccup) can't fail the whole job
        # either — gosec's own exit code, not this upload, is what gates the
        # pipeline on a genuine finding.
        if: always() && hashFiles('gosec-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      - name: Trivy filesystem scan (dependency CVEs in go.sum)
        # if: always() — this scan is independent of gosec above it (a
        # different tool checking a different thing: dependency CVEs, not Go
        # source SAST findings). Without this, a gosec failure (a real
        # HIGH/CRITICAL finding, which fails its own step with no
        # continue-on-error, by design — see the security-scan job's own
        # doc comment) silently skips every following step that has no
        # `if:` of its own, including this one: Trivy would never even run,
        # trivy-fs-results.sarif would never be created, and the *next*
        # step's hashFiles() guard would then correctly skip its own upload
        # — silently, no error, no results ever reaching the Security tab.
        # This actually happened (runs 33509914922 / 33511066735 on this
        # repo): gosec failed, Trivy was skipped, and at the time the
        # upload step's bare `if: always()` (pre-hashFiles-guard) tried to
        # upload a SARIF file that was never written and failed outright.
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy filesystem SARIF to GitHub Security tab
        # Same reasoning as the gosec upload above: guard against Trivy
        # itself failing to run (e.g. rate-limited pulling its vulnerability
        # DB) rather than running cleanly and finding a CVE, which is the
        # only case that should legitimately produce a missing-file error
        # here otherwise.
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-fs

      - name: Install gitleaks
        # if: always() — same independence reasoning as the Trivy step
        # above: gitleaks (secret scanning) has nothing to do with whether
        # gosec or Trivy found something, and must still run and report to
        # the Security tab even if either of them failed.
        if: always()
        run: go install github.com/zricethezav/gitleaks/v8@${{ env.GITLEAKS_VERSION }}

      - name: "Run gitleaks (secret scan: full git history + working tree)"
        # Scans every commit reachable from HEAD (not just the files
        # currently on disk), since a secret removed in a later commit is
        # still compromised for good — the fetch-depth: 0 checkout above is
        # what makes that actually possible in CI. --redact keeps the raw
        # secret value out of both the job log and the uploaded SARIF.
        # if: always() — see the two comments above; must run independently
        # of gosec/Trivy's own outcome.
        if: always()
        run: gitleaks detect --source . --redact --report-format sarif --report-path gitleaks-results.sarif --exit-code 1

      - name: Upload gitleaks SARIF to GitHub Security tab
        # Same reasoning as the gosec/Trivy uploads above.
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks

  # -------------------------------------------------------------------------
  # 4) Build (multi-arch) -> scan the image -> push to GHCR -> attest
  # -------------------------------------------------------------------------
  build-scan-push:
    name: Build, scan, push & attest Docker image
    needs: [lint, test, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push to ghcr.io with GITHUB_TOKEN
      security-events: write # required to upload the image-scan SARIF
      actions: read # required by upload-sarif to read this workflow run (private repos)
      id-token: write # required to mint the Sigstore/SLSA attestation
      attestations: write # required to attach the attestation to the image
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute lowercase image name
        id: image
        # GHCR requires a fully lowercase repository path; github.repository
        # ("FernandezBenjamin/Trakka") is not guaranteed to be lowercase.
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Should this run push to GHCR?
        id: policy
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            push=false
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            push=${{ github.event.inputs.push_to_ghcr }}
          else
            push=true
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            # `latest` must only ever move on a real release tag push
            # (v1.2.3, ...), never on an ordinary push/merge to `main` —
            # `startsWith(github.ref, 'refs/tags/v')` is true exactly for a
            # `v*.*.*` tag push (and for a `release: published` event fired
            # from such a tag), false for every branch push including main.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # The tag's own semver, e.g. `v1.2.3` — only produced when the
            # ref is actually a tag matching this pattern (metadata-action's
            # own semver-type gating), so this is a no-op on a branch push.
            type=semver,pattern={{raw}}
            # A sanitized branch-name tag (e.g. `main`, `feature-xyz`) and a
            # `sha-<short>` commit tag, generated for every push — including
            # feature branches — so a non-release build is still traceable
            # in the registry without ever touching `latest`.
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up QEMU (for linux/arm64 emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        if: steps.policy.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-platform images built with buildx cannot be `--load`ed into the
      # local Docker daemon, so we first build a single-arch (linux/amd64)
      # image locally purely to scan it with Trivy *before* anything is
      # pushed. The final multi-arch build below reuses the same GHA cache,
      # so this doesn't meaningfully slow the pipeline down.
      - name: Build local image for scanning (linux/amd64 only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: trakka:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (CVEs, before any push)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: trakka:scan
          scan-type: image
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy image SARIF to GitHub Security tab
        # Same reasoning as the other three SARIF uploads above.
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

      - name: Build & push multi-arch image
        id: push
        if: steps.policy.outputs.push == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance (SLSA)
        if: steps.policy.outputs.push == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
