# Compatible with `docker compose` and `podman-compose` (rootless).
#
# Start Trakka only:
#   docker compose up -d
#   podman-compose up -d
#
# Also start the optional CalDAV sync server:
#   docker compose --profile calendar up -d
#   podman-compose --profile calendar up -d

services:
  trakka:
    image: trakka:latest
    container_name: trakka
    restart: unless-stopped
    environment:
      PORT: "8080"
      DB_PATH: /data/trakka.db
      STATIC_DIR: /app/static
      # TZ intentionally not set: the distroless runtime image ships no
      # tzdata, so it would be silently ignored — every timestamp this app
      # stores or logs is already UTC by convention (see CLAUDE.md).
      # Uncomment to let the encrypted WebDAV backups (admin console →
      # Sauvegardes) reach a server on your LAN/Tailscale, e.g. a Nextcloud
      # next to Trakka — see docs/DEPLOYMENT.md#encrypted-webdav-backups.
      # BACKUP_WEBDAV_ALLOW_PRIVATE: "true"
    ports:
      - "8080:8080"
    volumes:
      - trakka_data:/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - trakka_net
    healthcheck:
      test: ["CMD", "/app/trakka", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # Runtime hardening: the image is distroless (no shell) and runs as the
    # fixed non-root UID:GID baked into the Dockerfile; the root filesystem
    # is read-only and every Linux capability is dropped since a plain HTTP
    # server talking to SQLite needs none of them (not even NET_BIND_SERVICE,
    # since it binds an unprivileged port). /data (the SQLite file, including
    # its -wal/-shm siblings) and /tmp are the only writable paths.
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Optional lightweight CalDAV server, for calendar-based sync of task
  # lists. Not started by default; enable with --profile calendar.
  radicale:
    image: docker.io/tomsquest/docker-radicale:latest
    container_name: radicale
    restart: unless-stopped
    profiles:
      - calendar
    ports:
      - "5232:5232"
    volumes:
      - radicale_data:/data
      - radicale_config:/config
    networks:
      - trakka_net
    security_opt:
      - no-new-privileges:true

networks:
  trakka_net:
    driver: bridge

volumes:
  trakka_data:
  radicale_data:
  radicale_config:
